@if (isVisible()) {
<section class="cookie-banner" aria-label="Gestion des cookies">
  <div class="cookie-banner__content">
    <p class="cookie-banner__title">Gestion des cookies</p>
    <p class="cookie-banner__text">
      CESIZen utilise uniquement une préférence locale pour mémoriser ton choix.
      Cette bannière permet d’intégrer le geste de consentement dans l’interface.
    </p>
  </div>

  <div class="cookie-banner__actions">
    <button
      type="button"
      class="cookie-banner__button cookie-banner__button--secondary"
      (click)="refuseCookies()"
    >
      Refuser
    </button>

    <button
      type="button"
      class="cookie-banner__button cookie-banner__button--primary"
      (click)="acceptCookies()"
    >
      Accepter
    </button>
  </div>
</section>
}
