<section class="reset-page">
  <div class="reset-card">
    <p class="eyebrow">Réinitialisation</p>

    <h1>Nouveau mot de passe</h1>

    @if (!success()) {
    <p class="description">
      Choisis un nouveau mot de passe pour ton compte (minimum 12 caractères).
    </p>

    <form (ngSubmit)="submit()" class="form">
      <label>
        Nouveau mot de passe
        <input
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          placeholder="Minimum 12 caractères"
          autocomplete="new-password"
        />
      </label>

      <label>
        Confirmer le mot de passe
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirme ton mot de passe"
          autocomplete="new-password"
        />
      </label>

      @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Enregistrement...' : 'Réinitialiser le mot de passe' }}
      </button>
    </form>
    } @else {
    <div class="success-message">
      <p>Ton mot de passe a été réinitialisé avec succès.</p>
    </div>
    }

    <p class="helper">
      <a routerLink="/connexion">Retour à la connexion</a>
    </p>
  </div>
</section>
