<section class="admin-page">
  <div class="page-header">
    <p class="eyebrow">Administration</p>
    <h1>Utilisateurs</h1>
    <p class="subtitle">Gestion des comptes utilisateurs actifs.</p>
  </div>

  <p *ngIf="loading()" class="info-message">Chargement des utilisateurs</p>

  <div class="table-wrapper" *ngIf="!loading()">
    <table>
      <thead>
      <tr>
        <th>Pseudo</th>
        <th>Email</th>
        <th>Rôle</th>
        <th>Dernière connexion</th>
        <th>Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngIf="users().length === 0">
        <td colspan="5" class="empty">Aucun utilisateur actif.</td>
      </tr>
      <tr *ngFor="let user of users()">
        <td>{{ user.pseudo }}</td>
        <td>{{ user.mail }}</td>
        <td>{{ user.role }}</td>
        <td>{{ getLastConnection(user) }}</td>
        <td class="actions">
          <button
            type="button"
            class="danger"
            (click)="disableUser(user.id)"
          >
            Désactiver
          </button>

          <button
            *ngIf="user.role === 'USER'"
            type="button"
            class="promote"
            (click)="promoteUser(user.id)"
          >
            Promouvoir admin
          </button>

          <button
            *ngIf="user.role === 'ADMIN'"
            type="button"
            class="demote"
            (click)="demoteUser(user.id)"
          >
            Retirer admin
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</section>
